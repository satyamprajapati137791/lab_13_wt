<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>STUDENT REG FORM</h1>
    <form id="studentForm" onsubmit="return validateMyform()">
        Enrollment Number: <br>
        <input type="text" id="enrollment"><br><br>
        
        Name: <br>
        <input type="text" id="name"><br><br>
        
        Email ID: <br>
        <input type="email" id="email"><br><br>
        
        Password: <br>
        <input type="password" id="password"><br><br>
        
        Confirm Password: <br>
        <input type="password" id="confirmPassword"><br><br>
        
        Phone Number: <br>
        <input type="text" id="phone"><br><br>
        
        Address: <br>
        <textarea id="address" rows="3" cols="30"></textarea><br><br>
        
        Gender: <br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <br><br>
        
        Branch: <br>
        <select id="branch">
            <option value="">--Select Branch--</option>
            <option value="Computer Engineering">Computer Engineering</option>
            <option value="IT Engineering">IT Engineering</option>
            <option value="Electronics">Electronics</option>
            <option value="Mechanical">Mechanical</option>
            <option value="Civil">Civil</option>
        </select><br><br>
        
        <input type="submit" value="Submit">
    </form>

    <script>
    function validateMyform() {
        let enrollment = document.getElementById("enrollment").value.trim();
        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("email").value.trim();
        let password = document.getElementById("password").value;
        let confirmPassword = document.getElementById("confirmPassword").value;
        let phone = document.getElementById("phone").value.trim();
        let address = document.getElementById("address").value.trim();
        let gender = document.querySelector('input[name="gender"]:checked');
        let branch = document.getElementById("branch").value;

        // 1. Empty form check (all fields empty)
        if (enrollment === "" && name === "" && email === "" && password === "" && 
            confirmPassword === "" && phone === "" && address === "" && !gender && branch === "") {
            alert("Form cannot be submitted empty. Please fill out the form!");
            return false;
        }

        // 2. Individual empty field checks
        if (enrollment === "") {
            alert("Please enter Enrollment Number");
            return false;
        }
        if (name === "") {
            alert("Please enter Name");
            return false;
        }
        if (email === "") {
            alert("Please enter Email ID");
            return false;
        }
        if (password === "") {
            alert("Please enter Password");
            return false;
        }
        if (confirmPassword === "") {
            alert("Please enter Confirm Password");
            return false;
        }
        if (phone === "") {
            alert("Please enter Phone Number");
            return false;
        }
        if (address === "") {
            alert("Please enter Address");
            return false;
        }
        if (!gender) {
            alert("Please select Gender");
            return false;
        }
        if (branch === "") {
            alert("Please select Branch");
            return false;
        }

        // Enrollment Validation
        let enrollmentpattern = /^[0-9]+$/;
        if (!enrollment.match(enrollmentpattern)) {
            alert("Enrollment number must contain only digits");
            return false;
        }

        // Name Validation
        let namepattern = /^[a-zA-Z\s]+$/;
        if (!name.match(namepattern)) {
            alert("Name must contain only letters and spaces");
            return false;
        }

        // Email Validation
        let emailpattern = /^[a-z]+\.{1}[a-z]+[0-9]{6}@marwadiuniversity\.ac\.in$/;
        if (!email.match(emailpattern)) {
            alert("Invalid email address");
            return false;
        }

        // Password Length Validation
        if (password.length < 6) {
            alert("Password must be at least 6 characters long!");
            return false;
        }

        // Password Match Validation
        if (password !== confirmPassword) {
            alert("Password and confirm password do not match");
            return false;
        }

        // Phone Validation
        let phonepattern = /^[0-9]{10}$/;
        if (!phone.match(phonepattern)) {
            alert("Invalid phone number. Enter a 10-digit number");
            return false;
        }

        // Address Validation
        if (address.length < 10) {
            alert("Address must be at least 10 characters long");
            return false;
        }

        // All validations passed
        alert("Registration Successful!");
        return true;
    }
    </script>
</body>
</html>
